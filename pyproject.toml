[project]
name = "podpack-pages"
version = "0.3.3"
description = "Content pages for podpack sites: one name space, Markdown first, HTML second"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    # Imported directly by the blog app (its publish environment), so declared
    # rather than borrowed from flask's own dependency on it.
    "jinja2>=3.1",
    "markdown>=3.5.2",
    # codehilite imports Pygments optionally and, without it, quietly emits a
    # bare <pre> with no highlighting. The test environment always had it (via
    # pytest); production never did. A recent floor: nothing here needs a
    # particular Pygments feature.
    "pygments>=2.18",
    "python-markdown-math>=0.8",
]

[[project.authors]]
name = "Steve Holden"
email = "steve@holdenweb.com"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

# podpack is deliberately absent from `dependencies`: a real dependency's
# [tool.uv.sources] entry travels with the distribution, so a site whose own
# podpack source differs could never lock. A dependency group is dev-only
# metadata and constrains nobody. See writing-an-app.md rule 1.
[dependency-groups]
dev = [
    "podpack",
    "pytest>=8.0",
    "mypy>=1.11",
    "types-markdown>=3.10.2.20260712",
]

[tool.uv.sources]
# The published repository, not a path. An editable pointer at an absolute
# home directory resolved on exactly one machine and put that path into a
# committed lockfile, so this package could not be locked, built or tested
# anywhere else -- including CI, which is now what publishes it.
podpack = { git = "https://github.com/holdenweb/podpack.git" }

[tool.mypy]
files = ["src", "tests"]

[tool.pytest.ini_options]
# Where the tests are, so a bare `pytest` does not walk the whole tree -- and
# so that Wing's test auto-detection, which reads this file, knows the project
# uses pytest rather than loading test functions unittest-style without their
# fixtures.
testpaths = ["tests"]
